name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Export iOS, Android and web bundles
        run: pnpm mobile:export
        env:
          EXPO_NO_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-export
          path: apps/mobile/dist
